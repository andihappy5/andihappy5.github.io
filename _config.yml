# ---------------- #
#   Main Configs   #
# ---------------- #
baseurl:
url: https://andihappy5.github.io
date_format: "ordinal"
title: 飞翔的面包
author: Happy Zhai 

# email: zlzdbf@gmail.com

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
    input: GFM
paginate: 20
permalink: /:year/:month/:day/:title/
#gems:
plugins:
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-feed
    # - jemoji
collections:
    wiki:
        output: true
        permalink: /wiki/:path/

